services:
  server:
    build: ./server
    image: clinic-server:latest
    container_name: clinic-server
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    image: clinic-frontend:latest
    container_name: clinic-frontend
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - ./frontend:/app
      - /app/node_modules