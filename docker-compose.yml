services:
  server:
    build: ./server
    image: clinic-server22:latest
    container_name: clinic-server22
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - server_node_modules22:/app/node_modules

  frontend:
    build: ./frontend
    image: clinic-frontend22:latest
    container_name: clinic-frontend22
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - ./frontend:/app
      - frontend_node_modules22:/app/node_modules

volumes:
  server_node_modules22:
  frontend_node_modules22: